<body data-page="what-helps">

<header class="bar">
  <div class="wrap">
    <a class="brand" href="index.html" aria-label="London Flame home">
      <img src="images/logo.svg" alt="London Flame" width="135" height="66">
    </a>
    <nav class="bar-links" aria-label="Quick links">
      <a href="calendars.html">Calendar</a>
      <a href="index.html#payment">Pay</a>
      <a class="cta" href="index.html#join">Join</a>
      <button class="menu-btn" type="button" aria-expanded="false">Menu</button>
    </nav>
  </div>
</header>

<div class="wrap page" id="top">
  <aside class="toc" aria-label="Site navigation">
    <nav id="site-nav"><a href="index.html">Club</a> <a href="team.html">WFFL Team</a> <a href="committee.html">Committee</a></nav>
  </aside>

  <main>
    <div class="hero hero-sm">
      <p class="kicker">London Flame · Workshop</p>
      <h1>What do you need when you're struggling?</h1>
    </div>

    <section id="share">
      <form class="wh-form" id="wh-form" novalidate>
        <label class="wh-label" for="wh-answer">Your answer</label>
        <textarea id="wh-answer" name="answer" rows="4" maxlength="500" required
          placeholder="e.g. someone to check in on me, a walk, time to talk, a bit of space"></textarea>
        <div class="wh-row">
          <span class="note" id="wh-count">0 / 500</span>
        </div>

        <fieldset class="wh-who">
          <legend class="wh-label">Who's answering?</legend>
          <label class="wh-choice"><input type="radio" name="who" id="wh-anon" value="anon" checked> Stay anonymous</label>
          <label class="wh-choice"><input type="radio" name="who" id="wh-named" value="named"> Share my name</label>
          <div class="wh-name" id="wh-name-wrap" hidden>
            <label class="wh-label" for="wh-name">Your name</label>
            <input type="text" id="wh-name" name="name" maxlength="60" autocomplete="name">
          </div>
        </fieldset>

        <!-- left empty by people; bots fill it in -->
        <div class="wh-hp" aria-hidden="true">
          <label for="wh-website">Website</label>
          <input type="text" id="wh-website" name="website" tabindex="-1" autocomplete="off">
        </div>

        <div class="wh-actions">
          <button type="submit" class="wh-submit" id="wh-submit">Share</button>
          <p class="wh-status" id="wh-status" role="status" aria-live="polite"></p>
        </div>
      </form>
    </section>

    <section id="answers">
      <h2>What our team said</h2>
      <p class="note" id="wh-total">Loading answers…</p>
      <ul class="wh-bubbles" id="wh-bubbles" aria-label="Answers"></ul>
    </section>
  </main>
</div>

<footer>
  <div class="wrap">
    <span>London Flame · Women's flag football · Clapham Common, London</span>
    <span>committee.ldnflame@gmail.com</span>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="site.js"></script>
<script src="what-helps.js"></script>
</body>
</html>
